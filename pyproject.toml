[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "phrase-engine"
version = "0.1.0"
description = "Standalone Python MIDI phrase engine"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "python-rtmidi>=1.5.8",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
phrase-engine = "phrase_engine.__main__:main"

[tool.setuptools.packages.find]
include = ["phrase_engine*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
